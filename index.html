/* ---------------------------------------------------------------- progresso */
/* colunas de uma série; alvo opcional vira a linha tracejada do previsto.
   Toque ou foco numa coluna mostra o valor na linha de leitura (.rd). */
function colunas(vals, alvo, cor, rotulos, dicas){
  var todos = vals.concat(alvo || []).map(function(v){ return v || 0; });
  var max = Math.max.apply(null, todos.concat([1]));
  var h = '<div class="cols">';
  for(var i=0;i<vals.length;i++){
    var v = vals[i] || 0;
    h += '<div class="col" tabindex="0" data-tip="'+esc(dicas[i])+'">';
    if(alvo && alvo[i]) h += '<u style="bottom:'+(alvo[i]/max*100)+'%"></u>';
    h += '<i style="height:'+(v/max*100)+'%;background:'+(v ? cor : "var(--line)")+';opacity:'+(v ? 1 : .35)+'"></i></div>';
  }
  h += '</div><div class="axis">';
  for(var j=0;j<vals.length;j++) h += '<span>'+(rotulos ? rotulos[j] : j+1)+'</span>';
  return h + '</div>';
}

function ultimaDica(vals, dicas, vazio){
  for(var i=vals.length-1;i>=0;i--) if(vals[i] > 0) return esc(dicas[i]);
  return vazio || "Toque numa coluna para ver o valor.";
}

function escala(a, b){
  if(a === b){ a = a - Math.max(1, Math.abs(a)*.1); b = b + Math.max(1, Math.abs(b)*.1); }
  var bruto = (b - a)/3, mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  var q = bruto/mag, passo = (q < 1.5 ? 1 : q < 3 ? 2 : q < 7 ? 5 : 10) * mag;
  return {min:Math.floor(a/passo)*passo, max:Math.ceil(b/passo)*passo, passo:passo};
}

/* evolução da carga de um exercício no tempo real: espaços largos são pausas */
function grafico(e, H){
  var W = 320, Ht = 136, L = 34, Rr = 14, T = 14, B = 22;
  var pc = H.every(function(s){ return !(s.kg > 0); });
  var vals = H.map(function(s){ return pc ? s.maxRep : s.kg; });
  var t0 = H[0].t, t1 = H[H.length-1].t;
  if(t1 - t0 < 864e5*14){ t0 -= 864e5*7; t1 += 864e5*7; }
  var sc = escala(Math.min.apply(null, vals), Math.max.apply(null, vals));
  var X = function(t){ return L + (t - t0)/(t1 - t0)*(W - L - Rr); };
  var Y = function(v){ return T + (1 - (v - sc.min)/(sc.max - sc.min))*(Ht - T - B); };
  var g = "";
  for(var v = sc.min; v <= sc.max + 1e-9; v += sc.passo){
    var y = Y(v);
    g += '<line class="gr" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y+'" y2="'+y+'"/>'+
         '<text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+fmt(v)+'</text>';
  }
  var tr = B2.inicio.getTime();
  if(tr > t0 && tr < t1){
    var xr = X(tr), esq = xr > W*.7;   /* perto da borda direita, o rótulo vai para a esquerda */
    g += '<line class="ret" x1="'+xr+'" x2="'+xr+'" y1="'+T+'" y2="'+(Ht-B)+'"/>'+
         '<text x="'+(esq ? xr-4 : xr+4)+'" y="'+(T+7)+'"'+(esq ? ' text-anchor="end"' : '')+'>retomada</text>';
  }
  for(var i=1;i<H.length;i++){
    var pausa = dias(H[i-1].data, H[i].data) > 10;
    g += '<line class="sp-l" x1="'+X(H[i-1].t)+'" y1="'+Y(vals[i-1])+'" x2="'+X(H[i].t)+'" y2="'+Y(vals[i])+'"'+
         (pausa ? ' stroke-dasharray="2 5"' : '')+'/>';
  }
  H.forEach(function(s, i){
    g += '<circle class="sp-p '+(s.b === "b2" ? "sp-b" : "sp-a")+'" cx="'+X(s.t)+'" cy="'+Y(vals[i])+'" r="4"/>';
  });
  H.forEach(function(s, i){
    var tip = ddmm(s.data)+" · "+fmtSessao(e, s)+(s.rpe != null ? " · RPE "+fmt(s.rpe) : "");
    g += '<circle class="hit" tabindex="0" cx="'+X(s.t)+'" cy="'+Y(vals[i])+'" r="12" data-tip="'+esc(tip)+'"/>';
  });
  var u = H.length-1, ux = X(H[u].t), uy = Math.max(T+2, Y(vals[u])-9);
  g += '<text x="'+(ux-7)+'" y="'+uy+'" text-anchor="end" style="fill:var(--text);font-size:10px">'+
       (pc ? vals[u]+" reps" : fmt(vals[u])+" kg")+'</text>';
  g += '<text x="'+X(H[0].t)+'" y="'+(Ht-5)+'"'+(H.length === 1 ? ' text-anchor="middle"' : '')+'>'+ddmm(H[0].data)+'</text>';
  if(H.length > 1) g += '<text x="'+ux+'" y="'+(Ht-5)+'" text-anchor="end">'+ddmm(H[u].data)+'</text>';
  return '<svg class="gx" viewBox="0 0 '+W+' '+Ht+'" role="img" aria-label="Evolução de '+esc(e.n)+'">'+g+'</svg>';
}

function dadosProg(){
  var H = hist(), tHoje = meia(new Date());
  var o = {H:H, prevS:0, feitas:0, sessoes:0, kmP:0, kmR:0, maiorL:0, semP:[], semR:[], longP:[], longR:[]};
  for(var w=1; w<=B2.semanas; w++){
    var kp = 0, kr = 0;
    GYM.forEach(function(d){
      if(meia(dataDe(B2, w, d)) > tHoje) return;
      var dados = log["gym:b2:w"+w+":"+d] || {}, algum = false;
      DIAS[d].ex.forEach(function(e){
        var n = seriesB2(e, w), reg = dados[sid(e)] || [];
        o.prevS += n;
        for(var k=0;k<n;k++) if(reg[k] && reg[k].ok){ o.feitas++; algum = true; }
      });
      if(algum) o.sessoes++;
    });
    DOW.forEach(function(d){
      var c = CORRIDA[w][d], r = run["b2:w"+w+":"+d];
      if(c){ kp += c.km; if(meia(dataDe(B2, w, d)) <= tHoje) o.kmP += c.km; }
      if(r && r.km > 0) kr += +r.km;
    });
    o.kmR += kr;
    o.semP.push(limpa(kp)); o.semR.push(limpa(kr));
    var rd = run["b2:w"+w+":dom"];
    o.longP.push(CORRIDA[w].dom.km); o.longR.push(rd && rd.km > 0 ? +rd.km : 0);
    if(rd && rd.km > o.maiorL) o.maiorL = +rd.km;
  }

  /* quanto da carga de antes da pausa já voltou */
  o.voltas = [];
  todosEx().forEach(function(e){
    if(e.pc) return;
    var Hs = H.g[sid(e)] || [], pos = null;
    Hs.forEach(function(s){ if(s.b === "b2") pos = s; });
    if(!antesDe(Hs, B2.inicio.getTime()) || !pos || !(pos.kg > 0)) return;
    var Bs = cargaBase(e);
    if(Bs.kg > 0) o.voltas.push({e:e, pct:pos.kg/Bs.kg, pos:pos, base:Bs});
  });
  o.media = o.voltas.length ? o.voltas.reduce(function(a, v){ return a + v.pct; }, 0)/o.voltas.length : null;

  /* linha do tempo desde o início do bloco antigo, até a semana atual */
  var fimT = Math.min(tHoje, meia(dataDe(B2, B2.semanas, "dom")));
  var NS = Math.max(1, Math.floor(dias(B1.inicio, new Date(fimT))/7) + 1);
  var ton = enche(NS, 0), km = enche(NS, 0), rit = enche(NS, 0), ritKm = enche(NS, 0);
  Object.keys(H.g).forEach(function(id){
    H.g[id].forEach(function(s){
      var i = Math.floor(dias(B1.inicio, s.data)/7);
      if(i >= 0 && i < NS) ton[i] += s.vol;
    });
  });
  var FACEIS = {"Fácil":1, "Regenerativo":1, "Longão":1, "Progressivos":1, "Meia maratona":1};
  H.r.forEach(function(r){
    var i = Math.floor(dias(B1.inicio, r.data)/7);
    if(i < 0 || i >= NS) return;
    km[i] += r.km;
    if(FACEIS[r.tipo] && r.seg > 0){ rit[i] += r.seg; ritKm[i] += r.km; }
  });
  o.rot = []; o.dTon = []; o.dKm = [];
  for(var i=0;i<NS;i++){
    var ini = new Date(B1.inicio.getTime()); ini.setDate(ini.getDate() + 7*i);
    o.rot.push((i % 4 === 0 && i < 12) || i === 13 || i === 17 ? ddmm(ini) : "");
    o.dTon.push("Semana de "+ddmm(ini)+": "+(ton[i]/1000).toFixed(1).replace(".", ",")+" t");
    o.dKm.push("Semana de "+ddmm(ini)+": "+fmtKm(km[i])+" km");
  }
  o.ton = ton.map(function(v){ return v/1000; });
  o.km = km;
  o.ritmo = rit.map(function(s, j){ return ritKm[j] > 0 ? s/ritKm[j] : 0; });
  return o;
}

function renderProg(){
  var o = dadosProg();
  var h = '<header class="hdr"><h1>Progresso</h1><p>Semana '+semanaAtual()+' de '+B2.semanas+' · retomada até '+
    ddmm(dataDe(B2, B2.semanas, "dom"))+'</p>'+
    '<div class="seg" role="radiogroup" aria-label="Tipo de progresso">'+
    '<button role="radio" aria-checked="'+(segProg === "forca")+'" data-seg="forca">Força</button>'+
    '<button role="radio" aria-checked="'+(segProg === "corrida")+'" data-seg="corrida">Corrida</button></div></header>';

  Array.prototype.forEach.call(view.querySelectorAll("[data-seg]"), function(b){

function cartaoPrincipal(e, o){
  var id = sid(e), Hs = o.H.g[id] || [], ult = Hs[Hs.length-1], pen = Hs[Hs.length-2];
  var nome = {sq:"Agachamento", bp:"Supino reto", dl:"Terra", ohp:"Desenvolvimento"}[e.main];
  var cor = {sq:"var(--d1)", bp:"var(--d2)", dl:"var(--d4)", ohp:"var(--d5)"}[e.main];
  var v = null; o.voltas.forEach(function(x){ if(x.e === e) v = x; });
  var dif = ult && pen && ult.kg > 0 && pen.kg > 0 ? limpa(ult.kg - pen.kg) : null;
  var dTxt = !ult ? "sem registro" : dif == null ? "em "+ddmm(ult.data) : dif > 0 ? "↑ "+fmt(dif)+" kg" : dif < 0 ? "↓ "+fmt(-dif)+" kg" : "= mesma carga";
  var p = v ? Math.round(v.pct*100) : null;
  return '<button class="main" data-h="'+id+'"><span><i class="dot" style="background:'+cor+'"></i>'+nome+'</span>'+
    '<b>'+(ult && ult.kg > 0 ? fmt(ult.kg)+" kg" : "–")+'</b>'+
    '<i class="'+(dif > 0 ? "up" : dif < 0 ? "dn" : "")+'">'+dTxt+'</i>'+
    (p != null ? '<span class="mt" role="img" aria-label="'+p+'% da carga de antes da pausa"><i style="width:'+Math.min(100, p)+'%"></i></span><i>voltou '+p+'%</i>'
               : spark(e, Hs.slice(-10), 140, 32))+'</button>';
}
function linhaEx(e, H){
  var id = sid(e), Hs = H.g[id] || [], ult = Hs[Hs.length-1], pen = Hs[Hs.length-2];
  var dk = ult && pen && !e.pc && ult.kg > 0 && pen.kg > 0 ? limpa(ult.kg - pen.kg) : 0;
  var sub = ult ? ddmm(ult.data)+" · "+fmtSessao(e, ult) : "sem registro";
  return '<button class="row flat" data-h="'+id+'"><span class="row-t"><b>'+esc(e.n)+'</b><span>'+esc(sub)+'</span></span>'+
    spark(e, Hs.slice(-10), 84, 30, "mini")+
    (dk ? '<span class="row-v"><i class="'+(dk > 0 ? "up" : "dn")+'">'+(dk > 0 ? "↑ " : "↓ ")+fmt(Math.abs(dk))+'</i></span>' : '')+
    IC.chev+'</button>';
}

function progForca(o){
  var h = '<section class="cell kpis" aria-label="Resumo da musculação">'+
    '<div><b>'+(o.prevS ? Math.round(o.feitas/o.prevS*100) : 0)+'%</b><span>séries feitas na retomada</span></div>'+
    '<div><b>'+(o.media != null ? Math.round(o.media*100)+"%" : "–")+'</b><span>da carga de antes da pausa</span></div>'+
    '<div><b>'+o.sessoes+'</b><span>'+(o.sessoes === 1 ? "treino registrado" : "treinos registrados")+'</span></div></section>';
  h += '<section class="sect"><div class="sec-h"><h2>Principais</h2></div><div class="mains">'+
    todosEx().filter(function(e){ return e.main; }).map(function(e){ return cartaoPrincipal(e, o); }).join("")+'</div>'+
    '<p class="foot">Carga de trabalho da última sessão e a diferença para a anterior. A barra mostra quanto da carga de antes da pausa já voltou. O plano é 80% na semana 1, 90% na 2 e 100% entre a 3 e a 5.</p></section>';
  GYM.forEach(function(d){
    var D = DIAS[d];
    h += '<section class="sect"><div class="sec-h"><h2>'+D.cod+' '+esc(D.nome)+'</h2><span>'+esc(D.eixo)+'</span></div>'+
      '<div class="list">'+D.ex.map(function(e){ return linhaEx(e, o.H); }).join("")+'</div></section>';
  });
  h += '<section class="sect"><div class="sec-h"><h2>Musculação por semana</h2></div><div class="cell chart-box">'+
    '<p class="cap">Toneladas levantadas desde 17/08</p>'+
    colunas(o.ton, null, "var(--d2)", o.rot, o.dTon)+'<p class="rd">'+ultimaDica(o.ton, o.dTon)+'</p></div>'+
    '<p class="foot">Coluna vazia é semana parada. Toque numa coluna para ver o valor.</p></section>';
  h += '<section class="sect"><div class="sec-h"><h2>Como a carga sobe</h2></div><div class="cell"><ol class="rules">'+
    '<li><b>Faixa e RPE.</b> Cada exercício tem uma faixa de repetições, como 8-10, e um RPE alvo para a última série.</li>'+
    '<li><b>Topo da faixa em todas as séries, no RPE alvo:</b> a carga sobe um degrau e você recomeça na base da faixa.</li>'+
    '<li><b>Dentro da faixa:</b> mesma carga e uma repetição a mais nas séries que ainda não chegaram ao topo.</li>'+
    '<li><b>Abaixo da faixa por 2 repetições ou mais:</b> a carga desce cerca de 5%.</li>'+
    '<li><b>Pausa de 2 semanas ou mais:</b> volta com 80 a 90% da carga e 2 séries. A memória muscular devolve a força em 2 a 3 semanas.</li>'+
    '<li><b>RPE:</b> 10 é falha e 8 significa que sobravam 2 repetições. É opcional: sem ele, o app considera que você bateu o alvo.</li>'+
    '</ol></div></section>';
  return h;
}

function progCorrida(o){
  var ultR = 0; o.ritmo.forEach(function(v){ if(v > 0) ultR = v; });
  var h = '<section class="cell kpis" aria-label="Resumo da corrida">'+
    '<div><b>'+fmtKm(o.kmR)+' km</b><span>de '+fmtKm(o.kmP)+' km até hoje</span></div>'+
    '<div><b>'+fmtKm(o.maiorL)+' km</b><span>maior longão, meta 21,1</span></div>'+
    '<div><b>'+(ultR ? mmss(ultR) : "–")+'</b><span>ritmo fácil recente</span></div></section>';

  var tHoje = meia(new Date()), rotL = [], dL = [], prox = null;
  for(var w=1; w<=B2.semanas; w++){
    var dd = dataDe(B2, w, "dom");
    rotL.push(ddmm(dd));
    dL.push(ddmm(dd)+": "+(o.longR[w-1] ? fmtKm(o.longR[w-1])+" de " : "previsto ")+fmtKm(o.longP[w-1])+" km");
    if(!prox && meia(dd) >= tHoje && !o.longR[w-1]) prox = w;
  }
  h += '<section class="sect"><div class="sec-h"><h2>Longão rumo aos 21 km</h2></div><div class="cell chart-box">'+
    colunas(o.longR, o.longP, "var(--ok)", rotL, dL)+
    '<p class="rd">'+(prox ? "Próximo: "+fmtKm(o.longP[prox-1])+" km em "+ddmm(dataDe(B2, prox, "dom"))+"." : "Todos os longões do bloco registrados.")+'</p>'+
    '<div class="lg"><span><i style="background:var(--ok)"></i>realizado</span><span><i class="dash"></i>previsto</span></div></div>'+
    '<p class="foot">O longão sobe cerca de 2 km por semana, o ritmo seguro depois da pausa. A primeira meia maratona, 21,1 km, fica para 03/01.</p></section>';

  var dS = [];

    if(meia(dt) >= tH) return {w:w, d:d, data:dt, P:prescreve(e, w, d)};

}

/* ---------------------------------------------------------------- háptico
   São dois caminhos independentes, e no iPhone o que vale é o primeiro.

   1. O overlay .hapt é um <input type="checkbox" switch> invisível por cima
      do botão (Safari 17.4+). Quem dispara o toque é o dedo acertando o
      controle, não o código: o iOS 26.5 bloqueou háptico programado, então
      .click() por script não serve mais. Duas consequências que valem
      lembrar antes de mexer aqui: no iPhone todo toque sai igual, sem como
      variar intensidade, e o fim do descanso não vibra, porque ali não há
      dedo nenhum na tela.

   2. Onde navigator.vibrate existe de verdade (Android), dá para variar a
      duração, e é o que toque() faz. No iPhone ela não faz nada, e tudo
      bem, porque o overlay já resolveu. Falha em silêncio, igual ao bip. */
function toque(padrao){
  try{ if(navigator.vibrate) navigator.vibrate(padrao); }catch(e){}
}

/* Linha de diagnóstico do Ajustes, para saber em que aparelho estamos. */
function ambiente(){
  var m = /OS ([0-9]+)[._]([0-9]+)/.exec(navigator.userAgent);
  return "iOS " + (m ? m[1]+"."+m[2] : "?") +
         " · vibrate " + (navigator.vibrate ? "existe" : "ausente") +
         " · wakeLock " + (navigator.wakeLock ? "ok" : "indisponível, use https");
}

/* ---------------------------------------------------------------- timer */
var fim = 0, tick = null, ac = null, avisado = true;
var elTimer = document.getElementById("acc");

/* ---------------------------------------------------------------- tela acesa
   Quando a tela apaga, o iOS suspende os timers da página em poucos
   segundos, o setInterval do cronômetro para e o apito nunca chega. O Wake
   Lock segura a tela acesa só enquanto o descanso corre, e solta no fim.

   Exige HTTPS: em http:// simples navigator.wakeLock nem existe, então em
   teste na rede local isto silenciosamente não faz nada. Também é liberado
   pelo próprio iOS quando a aba deixa de ficar visível, por isso é pedido
   de novo no visibilitychange enquanto ainda houver descanso correndo. */
var trava = null;

function seguraTela(){
  if(!navigator.wakeLock || trava) return;
  try{
    navigator.wakeLock.request("screen").then(function(t){
      trava = t;
      t.addEventListener("release", function(){ trava = null; });
    }, function(){});
  }catch(e){}
}

function soltaTela(){
  if(!trava) return;
  try{ trava.release(); }catch(e){}
  trava = null;
}

/* Pisca o cronômetro. É o único aviso que sobra quando o telefone está no
   silencioso E longe do ouvido, já que háptico sem dedo na tela é bloqueado. */
function pisca(){
  if(!elTimer) return;
  elTimer.classList.remove("flash");
  void elTimer.offsetWidth;   /* reinicia a animação */
  elTimer.classList.add("flash");
}

function bip(){
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
    [0, 220, 440].forEach(function(atraso){
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = 880;
      var t = ac.currentTime + atraso/1000;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
  toque([220,120,220]);
  pisca();
  soltaTela();
}

function restantes(){ return fim ? Math.max(0, Math.ceil((fim - Date.now())/1000)) : 0; }

function mostra(){
  /* meio minuto depois do apito o acessório volta ao estado de espera */
  if(fim && avisado && Date.now() > fim + 30000) fim = 0;
  var s = restantes();
  var el = document.getElementById("tnow");
  el.textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  el.classList.toggle("ring", s === 0 && fim > 0);
  if(s === 0 && fim > 0 && !avisado){ avisado = true; bip(); }
  pintaAcc();
}

function inicia(seg){
  try{ if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
       if(ac.state === "suspended") ac.resume(); }catch(e){}
  seguraTela();
  if(elTimer) elTimer.classList.remove("flash");
  fim = Date.now() + seg*1000;
  avisado = false;
  if(!tick) tick = setInterval(mostra, 250);
  mostra();
}

document.addEventListener("visibilitychange", function(){
  if(document.hidden) return;
  mostra();
  if(restantes() > 0) seguraTela();   /* o iOS solta a trava ao esconder a aba */
});
window.addEventListener("focus", mostra);

/* toque() cobre o Android. No iPhone quem vibra e o overlay .hapt dentro de
   cada botao, acionado pelo proprio dedo. */
document.getElementById("t60").onclick = function(){ toque(18); inicia(60); };
document.getElementById("t120").onclick = function(){ toque(18); inicia(120); };
document.getElementById("t180").onclick = function(){ toque(18); inicia(180); };
/* +30 s no descanso que está correndo, ou um descanso novo de 30 s */
document.getElementById("tplus").onclick = function(){
  toque(18);
  if(restantes() > 0){ fim += 30000; mostra(); }
  else inicia(30);
};
document.getElementById("tstop").onclick = function(){
  toque(18);
  fim = 0; avisado = true;
  if(elTimer) elTimer.classList.remove("flash");
  soltaTela();
  mostra();
};

/* ---------------------------------------------------------------- migrações
   1. Versões antigas gravavam a série sob o índice numérico do exercício.
      A chave passou a ser o slug estável sid(e). Converte uma única vez,
      usando a ordem dos exercícios do dia, que não mudou. Idempotente. */
function migraSlugs(){
  var mudou = false;
  Object.keys(log).forEach(function(k){
    var m = RX_G1.exec(k);
    if(!m) return;
    var lista = DIAS[m[2]] ? DIAS[m[2]].ex : null;
    if(!lista) return;
    var dados = log[k];
    Object.keys(dados).forEach(function(id){
      if(!/^\d+$/.test(id)) return;
      var e = lista[+id];
      if(!e) return;
      var novo = sid(e);
      if(novo === id) return;
      if(!dados[novo]) dados[novo] = dados[id];
      delete dados[id];
      mudou = true;
    });
  });
  if(mudou) S.store("luiz:gym:v1", log);
}

/* 2. As semanas 14 a 16 do plano antigo caem nas mesmas datas das semanas 1
      a 3 da retomada. O que foi registrado nelas muda de chave, com kg e
      reps explícitos, para aparecer no dia certo do plano novo. Não mexe se
      o dia novo já tiver registro. */
function migraB2(){
  var mg = false, mr = false;
  Object.keys(log).forEach(function(k){
    var m = RX_G1.exec(k); if(!m) return;
    var w = +m[1], d = m[2]; if(w < 14 || w > 16) return;
    var nk = "gym:b2:w"+(w-13)+":"+d;
    if(log[nk]) return;
    var dados = log[k];
    DIAS[d].ex.forEach(function(e){
      var reg = dados[sid(e)]; if(!reg) return;
      var pr = presB1(e, w);
      reg.forEach(function(r){
        if(!r) return;
        if(r.kg == null && pr.kg) r.kg = pr.kg;
        if(r.rep == null && repNum(pr.reps) != null) r.rep = repNum(pr.reps);
      });
    });
    log[nk] = dados; delete log[k]; mg = true;
  });
  Object.keys(run).forEach(function(k){
    var m = RX_R1.exec(k); if(!m) return;
    var w = +m[1], d = m[2]; if(w < 14 || w > 16) return;
    var nk = "b2:w"+(w-13)+":"+d;
    if(run[nk]) return;
    run[nk] = run[k]; delete run[k]; mr = true;
  });
  if(mg) S.store("luiz:gym:v1", log);
  if(mr) S.store("luiz:run:v1", run);
}

  document.addEventListener("keydown", teclaBotao);
  /* virou o dia com o app aberto: a aba Hoje acompanha */
  var diaVisto = meia(new Date());
  document.addEventListener("visibilitychange", function(){
    if(document.hidden || meia(new Date()) === diaVisto) return;
    diaVisto = meia(new Date());
    if(!pilhas[aba].length && !sheet.classList.contains("on")) render();
  });
  mostra();
  render();
})();
})();

</script>
