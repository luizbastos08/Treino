<style>
  html,body{margin:0;padding:0;background:#16181c;overscroll-behavior-y:none;
       -webkit-text-size-adjust:100%}
  button,.day,.chk,.ex-h,.tb,.bk,.rp,.xr,.col{-webkit-user-select:none;user-select:none;touch-action:manipulation}

  :root{
    --ink:#16181c; --surf:#1e2126; --surf2:#252932; --line:#333a44;
    --text:#eef1f5; --mut:#8c949f; --dim:#5f6773;
    --p25:#c8102e; --p20:#1f5fbf; --p15:#f2c53d; --p10:#1e9e5a; --p5:#e8ebef;
    --p2:#151719; --ok:#1e9e5a;
    --disp:"Avenir Next Condensed","Helvetica Neue Condensed","Arial Narrow",system-ui,sans-serif;
    --body:-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #app{font-family:var(--body);background:var(--ink);color:var(--text);
       min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom));
       font-size:15px;line-height:1.45}
  #app button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
  #app input{font-family:var(--mono);color:inherit}

  .bar{position:sticky;top:0;z-index:40;background:rgba(22,24,28,.94);
       -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
       border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .bar-top{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
  .wk{display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);
      border-radius:8px;padding:3px 4px}
  .wk button{width:28px;height:28px;font-size:18px;font-family:var(--mono);color:var(--mut);border-radius:6px}
  .wk button:active{background:var(--surf2)}
  .wk b{font-family:var(--disp);font-size:15px;letter-spacing:.04em;min-width:74px;text-align:center}
  .blk{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--mut);
       flex:1;text-align:right;line-height:1.25}
  .blk s{display:block;text-decoration:none;color:var(--p15);font-weight:700}
  .gear{width:32px;height:32px;border-radius:8px;background:var(--surf);border:1px solid var(--line);
        font-size:15px;display:grid;place-items:center}

  .days{display:flex;gap:6px;overflow-x:auto;padding:0 14px 11px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;padding:7px 11px 6px;border-radius:8px;background:var(--surf);
       border:1px solid var(--line);border-top:3px solid var(--line);text-align:left;min-width:62px}
  .day em{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
          color:var(--dim);font-style:normal}
  .day span{display:block;font-family:var(--disp);font-size:14px;letter-spacing:.02em;color:var(--mut)}
  .day.on{background:var(--surf2)}
  .day.on span{color:var(--text)}
  .day.on em{color:var(--mut)}

  .wrap{padding:16px calc(14px + env(safe-area-inset-left)) 0;max-width:640px;margin:0 auto}
  .hd{font-family:var(--disp);font-size:27px;line-height:1;letter-spacing:.01em;margin:0 0 3px}
  .sub{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--mut);margin:0 0 14px}

  .note{background:var(--surf);border-left:3px solid var(--p15);border-radius:0 8px 8px 0;
        padding:10px 12px;margin:0 0 16px;font-size:13.5px;color:#d3d8de}
  .note b{color:var(--p15)}

  .prog{height:3px;background:var(--surf2);overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
  /* O toque haptico do iPhone so sai quando o dedo acerta um switch de
     verdade: o iOS 26.5 bloqueou haptico disparado por script. Entao o
     switch fica por cima do botao, invisivel, e o clique dele borbulha
     para o botao normalmente. clip-path, e nao overflow, porque overflow
     recorta a pintura mas nao a area de toque. */
  .chk .hapt,.bk .hapt,.tb .hapt,.rp .hapt{position:absolute;inset:0;width:100%;height:100%;
       margin:0;padding:0;border:0;background:none;opacity:0;
       touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .chk .hapt,.rp .hapt{clip-path:inset(0 round 7px)}
  .bk .hapt{clip-path:inset(0 round 9px)}
  .tb .hapt{clip-path:inset(0 round 8px)}

  .ex{background:var(--surf);border:1px solid var(--line);border-radius:11px;
      margin:0 0 10px;overflow:hidden}
  .ex.done{border-color:#2c4a38}
  .ex-h{display:flex;align-items:flex-start;gap:10px;padding:13px 13px 12px;width:100%;text-align:left}
  .num{font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:3px;min-width:16px}
  .ex-t{flex:1;min-width:0}
  .ex-t h3{margin:0;font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:.01em;line-height:1.15}
  .ex-t p{margin:3px 0 0;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.03em}
  .kg{text-align:right;font-family:var(--mono);flex:0 0 auto}
  .kg b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
  .kg em{display:block;font-size:9.5px;color:var(--dim);font-style:normal;letter-spacing:.1em}
  .kg em.up{color:var(--p10)}
  .kg em.dn{color:var(--p15)}
  .tick{display:block;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);margin:5px 0 0 auto}
  .tick.on{background:var(--ok);border-color:var(--ok)}

  .ex-b{display:none;padding:0 13px 13px;border-top:1px solid var(--line);margin-top:2px}
  .ex.open .ex-b{display:block}

  .bell{display:flex;align-items:center;gap:1px;margin:13px 0 4px;height:34px}
  .bar-i{flex:1;height:4px;background:linear-gradient(var(--dim),#9aa3ad,var(--dim));border-radius:2px}
  .sleeve{width:9px;height:11px;background:#767e88;border-radius:1px}
  .pl{border-radius:2px;flex:0 0 auto;position:relative}
  .plate-lbl{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.05em;
             margin:0 0 12px;display:flex;justify-content:space-between}
  .plate-lbl b{color:var(--text)}

  /* alvo do dia: o que fazer hoje e por quê */
  .alvo{margin:13px 0 0;background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
  .alvo-t{display:flex;align-items:center;gap:6px 9px;flex-wrap:wrap}
  .alvo-t b{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-.02em}
  .alvo-t span{font-family:var(--mono);font-size:11.5px;color:var(--mut);letter-spacing:.02em}

<script>

(function(){
"use strict";

/* ---------------------------------------------------------------- estado */
var mem = {};
var S = {
  store: function(k, v){
    try { window.localStorage.setItem(k, JSON.stringify(v)); return; } catch(e){}
    mem[k] = JSON.stringify(v);
  },
  load: function(k, def){
    try { var r = window.localStorage.getItem(k); if(r) return JSON.parse(r); } catch(e){}
    if(mem[k]) return JSON.parse(mem[k]);
    return def;
  }
};

   A seleção é a da sua ficha full-body do Jeff Nippard. Campos:
   v      como a ficha prescrevia no bloco da Pampulha: [séries, reps, kg, RPE].
          Só serve para reconstruir o histórico de séries marcadas sem edição.
   s      séries nas semanas cheias do bloco de retomada.
   faixa  faixa de repetições da progressão dupla.
   alvo   RPE alvo da última série nas semanas cheias. rpe é o texto exibido.
   passo  menor degrau de carga daquele equipamento.
   pc     peso corporal. Com cinto, o kg anotado é a carga extra.
   desc   descanso em segundos que o cronômetro dispara ao marcar a série. */
function ex(n, cue, o){
  return {n:n, cue:cue, v:o.v, s:o.s||3, faixa:o.faixa||null, alvo:o.alvo||8,
          rpe:o.rpe||String(o.alvo||8), passo:o.passo||2.5, bb:!!o.bb, leg:!!o.leg,

          amrap:!!o.amrap, drop:!!o.drop, desc:o.desc==null?120:o.desc, note:o.note||""};
}

var DIAS = {
  seg:{id:"seg", cod:"D1", nome:"Pernas", eixo:"Agachamento", cor:"var(--p25)", ex:[
    ex("Agachamento livre", "Parafuse os pés no chão para estabilizar o quadril. Desça no mínimo até a coxa paralela. Termine com 2 a 3 repetições na reserva.",

       {v:[3,8,40,"7-8"], faixa:[8,10], alvo:8, rpe:"7-8", passo:2}),

       {v:[3,10,117.5,"7-8"], leg:true, iso:true, faixa:[10,12], alvo:8, rpe:"7-8"}),

       {v:[4,8,100,"8"], leg:true, iso:true, s:4, faixa:[8,10], alvo:8}),

    ex("Rosca direta barra W", "Nas semanas de progressão, a última série termina em drop set: reduza a carga pela metade, sem descanso, e faça mais 8 a 12. Único drop set do dia.",
       {v:[3,"12+12",30,"10"], iso:true, fail:true, drop:true, faixa:[10,12], alvo:10, rpe:"9-10", passo:2}),
    ex("Elevação de pernas na barra", "Contraia o abdômen para subir as pernas. Sem balanço do tronco.",
       {v:[3,12,0,"7"], iso:true, pc:true, faixa:[10,15], alvo:8, desc:90})

  ter:{id:"ter", cod:"D2", nome:"Peito", eixo:"Supino reto", cor:"var(--p20)", ex:[

var RX_G1 = /^gym:w(\d+):(seg|ter|qui|sex|sab)$/;
var RX_G2 = /^gym:b2:w(\d+):(seg|ter|qui|sex|sab)$/;

function sessao(e, b, w, data, sets, rpe){
  var cont = {}, kgT = 0, n = 0;
  sets.forEach(function(s){ cont[s.kg] = (cont[s.kg]||0) + 1; });
  Object.keys(cont).forEach(function(k){
    if(cont[k] > n || (cont[k] === n && +k > kgT)){ n = cont[k]; kgT = +k; }
  });
  var reps = [], e1 = 0, vol = 0, top = null;
  sets.forEach(function(s){
    if(s.rep == null) return;
    if(s.kg === kgT) reps.push(s.rep);
    vol += s.kg * s.rep;
    var x = s.kg * (1 + s.rep/30);
    if(x > e1){ e1 = x; top = s; }
  });
  var rir = rpe != null ? 10 - rpe : (b === "b1" ? rirB1(e) : 10 - rpeB2(e, w).alvo);
  return {t:data.getTime(), data:data, b:b, w:w, sets:sets, kg:kgT, reps:reps,
          rpe:rpe == null ? null : rpe, rir:rir, e1:e1, vol:vol, top:top,
          maxRep:reps.length ? Math.max.apply(null, reps) : 0};
}

function hist(){
  if(HC) return HC;
  var G = {}, R = [];
  Object.keys(log).forEach(function(k){
    var m = RX_G1.exec(k), bl = B1, b = "b1";
    if(!m){ m = RX_G2.exec(k); bl = B2; b = "b2"; }
    if(!m) return;
    var w = +m[1], d = m[2];
    if(w < 1 || w > bl.semanas) return;
    var data = dataDe(bl, w, d), dados = log[k] || {}, rpes = dados._rpe || {};
    DIAS[d].ex.forEach(function(e){
      var id = sid(e), reg = dados[id];
      if(!reg || !reg.length) return;
      var pr = b === "b1" ? presB1(e, w) : null, sets = [];
      reg.forEach(function(r){
        if(!r || !r.ok) return;
        var kg = r.kg != null ? +r.kg : (pr && pr.kg ? pr.kg : 0);
        var rep = r.rep != null ? +r.rep : (pr ? repNum(pr.reps) : null);
        sets.push({kg:kg || 0, rep:rep});
      });
      if(sets.length) (G[id] = G[id] || []).push(sessao(e, b, w, data, sets, rpes[id]));
    });
  });
  Object.keys(G).forEach(function(id){ G[id].sort(function(a,b){ return a.t - b.t; }); });
  Object.keys(run).forEach(function(k){
    var m = RX_R1.exec(k), bl = B1, b = "b1";
    if(!m){ m = RX_R2.exec(k); bl = B2; b = "b2"; }
    if(!m) return;
    var w = +m[1], d = m[2], r = run[k];
    if(!r || !(r.km > 0) || w < 1 || w > bl.semanas) return;
    var plan = b === "b2" ? CORRIDA[w][d] : null;
    var data = dataDe(bl, w, d);
    R.push({t:data.getTime(), data:data, b:b, w:w, d:d, km:+r.km, seg:(r.min||0)*60 + (r.seg||0),
            tipo:plan ? plan.tipo : b === "b2" ? "Fácil" : tipoB1(w, d)});
  });
  R.sort(function(a,b){ return a.t - b.t; });
  HC = {g:G, r:R};
  return HC;
}

/* ---------------------------------------------------------------- progressão
   Regras do Jeff Nippard aplicadas exercício a exercício:
   1. Cada exercício tem uma faixa de repetições e um RPE alvo.
   2. Topo da faixa em todas as séries, no RPE alvo: sobe um degrau de carga
      e recomeça na base da faixa. Muito fácil (RPE 2 abaixo do alvo, ou 3
      repetições acima do topo): sobe dois degraus.
   3. Dentro da faixa: mesma carga, uma repetição a mais por série.
   4. Abaixo da faixa por 2 repetições ou mais, ou em RPE 10: desce cerca de 5%.
   5. Pausa: semana 1 a 80%, semana 2 a 90%, e depois de 2 semanas sem um
      exercício, 80 a 90% da última carga conforme o tamanho da pausa. */
function seriesB2(e, w){
  if(w <= 2) return 2;
  if(w === 3) return Math.min(e.s, 3);
  if(w === 7 && e.leg) return Math.max(2, e.s - 1);
  return e.s;
}

function rpeB2(e, w){
  if(w === 1) return {txt:"5-6", alvo:6, semFalha:true};
  if(w === 2) return e.iso ? {txt:"9", alvo:9, semFalha:true} : {txt:"8", alvo:8, semFalha:true};
  var teto = e.iso ? 9 : 8;
  if(w === 3 && e.alvo > teto) return {txt:e.iso ? "8-9" : "7-8", alvo:teto, semFalha:true};
  if(w === 7 && e.leg && e.alvo > 8) return {txt:"7-8", alvo:8, semFalha:true};
  return {txt:e.rpe, alvo:e.alvo, semFalha:false};
}

/* carga de antes da pausa, já trazida para a faixa nova pela fórmula de Epley */
function cargaBase(e){
  var H = hist().g[sid(e)] || [], s = antesDe(H, B2.inicio.getTime());
  var lo = e.faixa ? e.faixa[0] : null;
  if(s){
    var kg = s.kg, r = s.reps.length ? Math.min.apply(null, s.reps) : null, conv = false;
    if(kg > 0 && r != null && lo != null && (r < lo - 1 || r > e.faixa[1] + 1)){
      kg = kg * (1 + (r + s.rir)/30) / (1 + (lo + 10 - e.alvo)/30);
      conv = true;
    }
    return {kg:kg, reps:s.maxRep || null, s:s, fonte:"hist", conv:conv};
  }
  if(e.main) return {kg:rmDe(e.main) / (1 + (lo + 10 - e.alvo)/30), reps:null, s:null, fonte:"rm"};
  return {kg:e.v[2] || 0, reps:repNum(e.v[1]), s:null, fonte:"ficha"};
}

function prescreve(e, w, d){
  var data = dataDe(B2, w, d);
  var H = hist().g[sid(e)] || [];
  var ant = antesDe(H, data.getTime());
  var R = rpeB2(e, w);
  var P = {w:w, sets:seriesB2(e, w), lo:e.faixa ? e.faixa[0] : null, hi:e.faixa ? e.faixa[1] : null,
           rpe:R.txt, alvo:R.alvo, semFalha:R.semFalha && e.fail, kg:null, reps:[],
           motivo:"", ant:ant, data:data, fase:3};
  if(w <= 2) P.fase = w;
  else if(ant && ant.b === "b2" && ant.w === 1) P.fase = 2;   /* a semana 1 foi leve de propósito */
  if(P.fase < 3) return retomada(e, P);
  if(!ant) return semRegistro(e, P);
  var gap = dias(ant.data, data);
  if(gap > 14) return voltaDePausa(e, P, gap);
  return dupla(e, P);
}

function retomada(e, P){
  var B = cargaBase(e), um = P.fase === 1, lo = P.lo;
  var rot = P.w <= 2 ? "Retomada, semana "+P.w : "Retomada";
  if(e.amrap){
    var mx = B.reps;
    P.kg = 0;
    P.reps = enche(P.sets, mx ? Math.max(3, Math.round(mx*(um ? .6 : .8))) : "");
    P.motivo = rot+": "+(um ? "2 séries bem longe da falha" : "2 séries parando 2 repetições antes da falha")+
      (mx ? ". Na última vez você fez "+mx+"." : ". Anote quantas fez.");
    return P;
  }
  if(e.pc){
    var extra = B.kg || 0;
    P.kg = um ? 0 : (extra > 0 ? arredE(e, extra*.5) : 0);
    P.reps = enche(P.sets, um ? Math.max(3, lo-2) : lo);
    P.motivo = um
      ? rot+": só o peso do corpo, 2 séries leves, sobrando 4 a 5 repetições na reserva."
      : rot+": "+(P.kg > 0 ? "metade da carga extra de antes da pausa ("+fmt(extra)+" kg). " : "")+
        "2 séries até RPE "+P.rpe+", buscando "+lo+" a "+P.hi+" repetições.";
    return P;
  }
  P.reps = enche(P.sets, lo);
  if(!(B.kg > 0)){
    P.kg = null;
    P.motivo = "Ainda não há carga registrada para este exercício. Escolha uma carga que deixe 4 repetições na reserva e anote: a partir dela o app calcula a progressão.";
    return P;
  }
  P.kg = arredE(e, B.kg * (um ? .8 : .9));
  var ref = !B.s ? (B.fonte === "rm" ? fmt(arredE(e, B.kg))+" kg, calculada do seu 1RM" : fmt(B.kg)+" kg da ficha")
          : B.conv ? fmtSessao(e, B.s)+" em "+ddmm(B.s.data)+", equivalente a "+fmt(arredE(e, B.kg))+" kg para "+lo+" repetições"
          : fmt(B.kg)+" kg em "+ddmm(B.s.data);
  P.motivo = um
    ? rot+": 80% da carga de antes da pausa ("+ref+"). 2 séries leves de "+lo+" repetições, sobrando 4 a 5 na reserva."
    : rot+": 90% da carga de antes da pausa ("+ref+"). Faça o máximo de repetições até "+P.hi+", com a última série em RPE "+P.rpe+". Esse registro define a progressão.";
  return P;
}

function semRegistro(e, P){
  var B = cargaBase(e);
  P.reps = enche(P.sets, e.amrap ? "" : P.lo);
  if(e.amrap || e.pc){
    P.kg = 0;
    P.motivo = "Sem registro deste exercício ainda. Anote as repetições de hoje: elas viram a referência da progressão.";
    return P;
  }
  if(!(B.kg > 0)){
    P.motivo = "Sem registro deste exercício ainda. Escolha uma carga para "+P.lo+" a "+P.hi+" repetições em RPE "+P.rpe+" e anote.";
    return P;
  }
  P.kg = arredE(e, B.kg * .9);
  P.motivo = "Sem registro deste exercício ainda. Comece com 90% da carga "+(B.fonte === "rm" ? "calculada do seu 1RM" : "da ficha")+" e anote o que fizer.";
  return P;
}

function voltaDePausa(e, P, gap){
  var ant = P.ant, f = gap <= 27 ? .9 : gap <= 55 ? .85 : .8, lo = P.lo;
  if(gap >= 21){
    P.sets = Math.min(P.sets, 2);
    if(P.alvo > 7){ P.alvo = 7; P.rpe = "6-7"; }
    P.semFalha = e.fail;
  }
  if(e.amrap){
    P.kg = 0;
    P.reps = enche(P.sets, ant.maxRep ? Math.max(3, Math.round(ant.maxRep*.7)) : "");
  } else if(e.pc){
    P.kg = ant.kg > 0 ? arredE(e, ant.kg*.5) : 0;
    P.reps = enche(P.sets, lo);
  } else if(!(ant.kg > 0)){
    P.reps = enche(P.sets, lo);
  } else {
    var base = ant.kg, r = ant.reps.length ? Math.min.apply(null, ant.reps) : null;
    if(r != null && lo != null && (r < lo - 1 || r > P.hi + 1))
      base = base * (1 + (r + ant.rir)/30) / (1 + (lo + 10 - e.alvo)/30);
    P.kg = arredE(e, base * f);
    P.reps = enche(P.sets, lo);
  }
  P.motivo = "Pausa de "+durTxt(gap)+" neste exercício (último registro em "+ddmm(ant.data)+"). "+
    (e.pc || e.amrap ? "Volta mais leve" : "Volta com "+Math.round(f*100)+"% da carga")+
    (gap >= 21 ? " e 2 séries" : "")+". Pela memória muscular, a força volta em poucas semanas.";
  return P;
}

function dupla(e, P){
  var ant = P.ant, lo = P.lo, hi = P.hi, reps = ant.reps, n = P.sets;
  var feito = "Em "+ddmm(ant.data)+": "+fmtSessao(e, ant)+(ant.rpe != null ? ", RPE "+fmt(ant.rpe) : "")+". ";
  if(!reps.length){
    P.kg = e.pc ? ant.kg : (ant.kg > 0 ? ant.kg : null);
    P.reps = enche(n, e.amrap ? "" : lo);
    P.motivo = "A última sessão ("+ddmm(ant.data)+") ficou sem repetições anotadas. Repita a carga e anote as repetições.";
    return P;
  }
  if(e.amrap){
    P.kg = ant.kg;
    P.reps = enche(n, function(i){ return (reps[i] != null ? reps[i] : reps[reps.length-1]) + 1; });
    P.motivo = "Bata o seu número: em "+ddmm(ant.data)+" foram "+reps.join(", ")+" repetições. Tente uma a mais em cada série.";
    return P;
  }
  if(!e.pc && !(ant.kg > 0)){
    P.reps = enche(n, lo);
    P.motivo = "A última sessão ficou sem carga anotada. Anote a carga de hoje para a progressão funcionar.";
    return P;
  }
  var minR = Math.min.apply(null, reps), topo = reps.every(function(r){ return r >= hi; });
  var rpe = ant.rpe, alvo = P.alvo;
  if(topo){
    if(rpe != null && rpe > alvo + .5){
      P.kg = ant.kg; P.reps = enche(n, hi);
      P.motivo = feito+"Bateu o topo da faixa, mas acima do RPE "+fmt(alvo)+". Mesma carga até as "+hi+" repetições saírem no alvo.";
      return P;
    }
    if(e.pc && !e.cinto){
      P.kg = 0; P.reps = enche(n, hi);
      P.motivo = feito+"Você já faz "+hi+" em todas as séries. Mantenha "+hi+" e desça em 3 segundos para continuar progredindo.";
      return P;
    }
    var deg = ((rpe != null && rpe <= alvo - 2) || minR >= hi + 3) ? 2 : 1;
    P.kg = arredE(e, ant.kg + deg*e.passo);
    P.reps = enche(n, lo);
    P.motivo = feito+"Bateu o topo da faixa ("+hi+") em todas as séries: a carga sobe "+fmt(P.kg - ant.kg)+" kg e você recomeça em "+lo+" repetições.";
    return P;
  }
  if(minR < lo){
    if(e.pc && !(ant.kg > 0)){
      P.kg = 0; P.reps = enche(n, lo);
      P.motivo = feito+"Ficou abaixo da faixa. Mantenha só o peso do corpo e busque "+lo+" repetições em todas as séries.";
      return P;
    }
    if(lo - minR >= 2 || (rpe != null && rpe >= 10)){
      var novo = arredE(e, ant.kg * .95);
      if(novo >= ant.kg) novo = arredE(e, ant.kg - e.passo);
      P.kg = novo; P.reps = enche(n, lo);
      P.motivo = feito+"Ficou abaixo da faixa de "+lo+" a "+hi+": a carga desce "+fmt(ant.kg - novo)+" kg para você voltar a ela.";
      return P;
    }
    P.kg = ant.kg; P.reps = enche(n, lo);
    P.motivo = feito+"Faltou 1 repetição para a faixa. Mesma carga, busque "+lo+" em todas as séries.";
    return P;
  }
  P.kg = ant.kg;
  var alvos = reps.map(function(r){ return Math.min(hi, Math.max(lo, r + 1)); });
  var menor = Math.min.apply(null, alvos);
  P.reps = enche(n, function(i){ return i < alvos.length ? alvos[i] : menor; });
  P.motivo = feito+"Dentro da faixa: mesma carga e uma repetição a mais onde ainda não chegou a "+hi+". Quando fizer "+hi+" em todas, a carga sobe.";
  return P;
}

var ANILHAS = [25,20,15,10,5,2.5,1.25];
var COR = {25:"var(--p25)",20:"var(--p20)",15:"var(--p15)",10:"var(--p10)",5:"var(--p5)",2.5:"#7d868f",1.25:"#5f6773"};
var ALT = {25:34,20:32,15:28,10:24,5:19,2.5:14,1.25:11};
function anilhas(total){
  var lado = (total - cfg.bar)/2, out = [];
  if(lado <= 0) return null;
  ANILHAS.forEach(function(p){ while(lado >= p - 0.01){ out.push(p); lado -= p; } });
  return {lista:out, sobra: lado < 0.05 ? 0 : Math.round(lado*100)/100};
}

/* ---------------------------------------------------------------- render */
var view = document.getElementById("view");
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); };

function chaveLog(){ return "gym:b2:w"+week+":"+day; }

/* Overlay invisivel que faz o iPhone vibrar quando o dedo toca o botao. */
var SW = '<input class="hapt" type="checkbox" switch aria-hidden="true" tabindex="-1">';

/* A barra de progresso do dia mora dentro do cabecalho fixo, fora de #view,
   por isso sobrevive ao innerHTML de cada render e acompanha a rolagem. */
function pintaProg(pct){
  var i = document.querySelector("#progDia i");
  if(i) i.style.width = pct+"%";
}

function render(){
  document.getElementById("wl").textContent = "SEMANA "+week;
  var F = FASES[week-1];
  document.getElementById("blk").innerHTML = "<s>"+F.nome+"</s>"+F.info;

  var tabs = [["seg","D1 Pernas"],["ter","D2 Peito"],["qua","Corrida"],["qui","D4 Pernas"],
              ["sex","D3 Costas"],["sab","D5 Ombros"],["dom","Longão"],["prog","Progresso"]];
  document.getElementById("days").innerHTML = tabs.map(function(t){
    var cor = DIAS[t[0]] ? DIAS[t[0]].cor : (t[0]==="prog" ? "var(--p15)" : "var(--mut)");
    var top = t[0]==="prog" ? "BLOCO" : t[0].toUpperCase()+" "+ddmm(dataDe(B2, week, t[0]));
    return '<button class="day'+(day===t[0]?" on":"")+'" data-d="'+t[0]+'" '+
      (day===t[0]?'style="border-top-color:'+cor+'"':'')+'>'+

  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".day"), function(b){
    b.onclick = function(){ day = b.dataset.d; render(); window.scrollTo(0,0); };
  });

  document.getElementById("progDia").hidden = !DIAS[day];

  if(day === "prog") renderProg();
  else if(DIAS[day]) renderGym();

}

/* ---------------------------------------------------------------- registro de corrida */
function chaveRun(w,d){ return "b2:w"+w+":"+d; }

function mmss(seg){
  seg = Math.round(seg);
  return Math.floor(seg/60)+":"+String(seg%60).padStart(2,"0");
}

function blocoRun(w, d){
  var c = CORRIDA[w][d]; if(!c) return "";
  var r = run[chaveRun(w,d)] || {};
  var saida = "";
  if(r.km > 0 && (r.min > 0 || r.seg > 0)){
    var s = ((r.min||0)*60 + (r.seg||0)) / r.km;
    saida = "Ritmo médio " + mmss(s) + " /km · " + fmtKm(r.km) + " km em " +
            (r.min||0) + "min" + String(r.seg||0).padStart(2,"0");
  }
  return '<div class="rl"><h4>REGISTRAR A CORRIDA · PREVISTO '+fmtKm(c.km)+' KM</h4>'+
    '<div class="rl-g">'+
    '<div class="rl-f"><input type="number" inputmode="decimal" step="0.1" data-r="km" value="'+(r.km!=null?r.km:"")+'"><em>km</em></div>'+
    '<div class="rl-f"><input type="number" inputmode="numeric" data-r="min" value="'+(r.min!=null?r.min:"")+'"><em>min</em></div>'+
    '<div class="rl-f"><input type="number" inputmode="numeric" data-r="seg" value="'+(r.seg!=null?r.seg:"")+'"><em>s</em></div>'+
    '<div class="rl-f"><input type="number" inputmode="numeric" data-r="pse" value="'+(r.pse!=null?r.pse:"")+'"><em>PSE</em></div>'+
    '</div>'+(saida?'<p class="rl-out">'+saida+'</p>':'')+'</div>';
}

function ligaRun(w, d){
  Array.prototype.forEach.call(view.querySelectorAll(".rl-f input"), function(inp){
    inp.onchange = function(){
      var k = chaveRun(w,d);
      if(!run[k]) run[k] = {};
      run[k][inp.dataset.r] = inp.value === "" ? null : +inp.value;
      S.store("luiz:run:v1", run);
      sujo(); mudou();
      render();
    };
  });
}

/* ---------------------------------------------------------------- peças do card */
function kgCab(e, P){
  if(P.kg == null) return '<b>?</b><em>ANOTE</em>';
  if(e.pc) return P.kg > 0 ? '<b>+'+fmt(P.kg)+'</b><em>KG EXTRA</em>' : '<b>PC</b><em>CORPO</em>';
  var a = P.ant, d = a && a.kg > 0 ? limpa(P.kg - a.kg) : null;
  var em = d == null ? '<em>KG</em>' : d > 0 ? '<em class="up">▲ '+fmt(d)+'</em>' :
           d < 0 ? '<em class="dn">▼ '+fmt(-d)+'</em>' : '<em>MESMA</em>';
  return '<b>'+fmt(P.kg)+'</b>'+em;
}

function alvoKg(e, P){
  if(P.kg == null) return "Anote a carga";
  if(e.pc) return P.kg > 0 ? "+"+fmt(P.kg)+" kg" : "Peso do corpo";
  return fmt(P.kg)+" kg";
}

function repsTxt(e, P){
  if(e.amrap) return P.reps[0] !== "" && P.reps[0] != null ? P.reps.join("·")+" reps" : "máx";
  if(P.fase === 2) return P.lo+"-"+P.hi+" reps";
  var todas = P.reps.every(function(r){ return r === P.reps[0]; });
  return (todas ? P.reps[0] : P.reps.join("·"))+" reps";
}

function deltaTxt(e, P){
  var a = P.ant;
  if(!a || P.kg == null) return "";
  if(e.pc ? !(P.kg > 0) && !(a.kg > 0) : !(a.kg > 0)) return "";
  var d = limpa(P.kg - a.kg), q = " vs "+ddmm(a.data);
  if(d > 0) return '<i class="dl up">▲ '+fmt(d)+' kg'+q+'</i>';
  if(d < 0) return '<i class="dl dn">▼ '+fmt(-d)+' kg'+q+'</i>';
  return '<i class="dl eq">mesma carga'+q+'</i>';
}

/* sparkline: carga de trabalho por sessão, ou repetições no peso do corpo.
   Cinza antes da retomada, verde depois. Tracejado marca pausa de 10+ dias. */
function spark(e, H, W, Hh, cls){
  if(H.length < 2) return "";
  var pc = H.every(function(s){ return !(s.kg > 0); });
  var vals = H.map(function(s){ return pc ? s.maxRep : s.kg; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if(mx === mn){ mx += 1; mn -= 1; }
  var p = 6, n = H.length, g = "";
  var X = function(i){ return p + i*(W-2*p)/(n-1); };
  var Y = function(v){ return Hh - p - (v-mn)/(mx-mn)*(Hh-2*p); };
  for(var i=1;i<n;i++){
    var pausa = dias(H[i-1].data, H[i].data) > 10;
    g += '<line class="sp-l" x1="'+X(i-1)+'" y1="'+Y(vals[i-1])+'" x2="'+X(i)+'" y2="'+Y(vals[i])+'"'+
         (pausa ? ' stroke-dasharray="2 5"' : '')+'/>';
  }
  H.forEach(function(s, i){
    g += '<circle class="sp-p '+(s.b === "b2" ? "sp-b" : "sp-a")+'" cx="'+X(i)+'" cy="'+Y(vals[i])+'" r="4"/>';
  });
  return '<svg class="'+(cls||"spark")+'" viewBox="0 0 '+W+' '+Hh+'" aria-hidden="true">'+g+'</svg>';
}

function miniHist(e, P){
  var t = P.data.getTime();
  var H = (hist().g[sid(e)] || []).filter(function(s){ return s.t <= t; });
  if(!H.length) return '<div class="hi"><b>HISTÓRICO</b><p class="empty" style="font-size:12.5px;margin:0">Nenhum registro ainda. Do primeiro treino anotado em diante, a carga sugerida usa os seus números.</p></div>';
  var rows = "", ult = H.slice(-5).reverse();
  ult.forEach(function(s, i){
    rows += '<div class="hr"><i>'+(s.t === t ? "hoje" : ddmm(s.data))+'</i><span>'+esc(fmtSessao(e, s))+'</span>'+
            (s.rpe != null ? '<em>RPE '+fmt(s.rpe)+'</em>' : '')+'</div>';
    var prox = ult[i+1];
    if(prox){ var g = dias(prox.data, s.data); if(g > 10) rows += '<div class="hp">pausa de '+durTxt(g)+'</div>'; }
  });
  var temAntes = H.some(function(s){ return s.b === "b1"; }), temDepois = H.some(function(s){ return s.b === "b2"; });
  var leg = H.length >= 2 && temAntes && temDepois
    ? '<div class="lg" style="margin:0 0 8px"><span><i class="dot" style="background:#5f6773"></i>antes de 16/11</span><span><i class="dot" style="background:var(--p10)"></i>retomada</span></div>' : '';
  return '<div class="hi"><b>HISTÓRICO · '+H.length+(H.length > 1 ? " SESSÕES" : " SESSÃO")+'</b>'+
         spark(e, H.slice(-12), 300, 48)+leg+rows+'</div>';
}

function rodape(feitas, total){
  return feitas+" de "+total+" séries concluídas. A carga sugerida vem da progressão dupla do Jeff Nippard sobre o seu último registro. Ajuste kg e reps se fizer diferente e toque ✓ para salvar.";
}

function renderGym(){
  var D = DIAS[day], dados = log[chaveLog()] || {}, rpes = dados._rpe || {};
  var feitas = 0, total = 0;
  var html = '<h1 class="hd">'+D.cod+" · "+D.nome.toUpperCase()+'</h1>'+
             '<p class="sub">'+D.eixo.toUpperCase()+" · "+ddmm(dataDe(B2, week, day))+'</p>';

  var manha = CORRIDA[week][day];
  if(manha){
    html += '<div class="note" style="border-left-color:var(--p10)">'+
      '<b style="color:var(--p10)">De manhã.</b> '+fmtKm(manha.km)+' km · '+esc(manha.txt)+'</div>'+
      blocoRun(week, day);
  }
  if(AVISO[day]) html += '<div class="note"><b>Hoje à noite.</b> '+AVISO[day]+'</div>';
  html += '<div class="note" style="border-left-color:var(--p25)"><b style="color:var(--p25)">'+
          FASES[week-1].nome+'.</b> '+REGRA[week-1]+(week <= 2 ? pausaTxt() : '')+'</div>';

  porId = {}; contagem = {};
  var corpo = D.ex.map(function(e, i){
    var P = prescreve(e, week, day), id = sid(e), reg = dados[id] || [];
    porId[id] = e; contagem[id] = P.sets;
    total += P.sets;
    var ok = 0;
    for(var k=0;k<P.sets;k++){ if(reg[k] && reg[k].ok) ok++; }
    feitas += ok;

    var anil = (e.bb && P.kg) ? anilhas(P.kg) : null;
    var bell = "";
    if(anil){
      bell = '<div class="bell"><div class="sleeve"></div>' +
        anil.lista.map(function(pl){
          return '<div class="pl" style="width:7px;height:'+ALT[pl]+'px;background:'+COR[pl]+'"></div>';
        }).join("") +
        '<div class="sleeve"></div><div class="bar-i"></div></div>' +
        '<div class="plate-lbl"><span>por lado</span><b>'+
        (anil.lista.length ? anil.lista.map(fmt).join(" + ")+" kg" : "só a barra") +
        (anil.sobra>0 ? " (faltam "+fmt(anil.sobra)+" kg)" : "") + '</b></div>';
    }

    var sets = "";

        '<div class="fld"><input type="number" inputmode="numeric" data-e="'+id+'" data-s="'+s+'" data-f="rep" '+
          'value="'+rpV+'"><em>rep</em></div>'+
        '<span class="chk'+(r.ok?" on":"")+'" role="button" aria-label="Série '+(s+1)+' feita" data-e="'+id+'" data-s="'+s+'">✓'+SW+'</span></div>';
    }

    var pres = P.sets+" x "+(e.amrap ? "máx" : P.lo+"-"+P.hi)+"  ·  RPE "+P.rpe;
    if(P.semFalha) pres += "  ·  SEM FALHA";
    if(e.drop && week >= 4) pres += "  ·  DROP NA ÚLTIMA";
    if(e.note) pres += "  ·  "+e.note;

    var drop = (e.drop && week >= 4 && P.kg) ? "<br><br>Drop set na última série: "+fmt(P.kg)+" kg, depois cerca de "+fmt(arredE(e, P.kg*.5))+" kg." : "";
    var chips = '<div class="rpe"><em>RPE DA ÚLTIMA<br>SÉRIE (OPCIONAL)</em>'+[6,7,8,9,10].map(function(v){
      return '<span class="rp'+(rpes[id]===v?" on":"")+'" role="button" aria-label="RPE '+v+'" data-e="'+id+'" data-v="'+v+'">'+v+SW+'</span>';
    }).join("")+'</div>';

    return '<div class="ex'+(ok===P.sets?" done":"")+(abertos[id]?" open":"")+'" data-ex="'+i+'" data-id="'+id+'">'+
      '<button class="ex-h"><span class="num">'+pad(i+1)+'</span>'+
      '<span class="ex-t"><h3>'+esc(e.n)+'</h3><p>'+esc(pres)+'</p></span>'+
      '<span class="kg">'+kgCab(e, P)+'<span class="tick'+(ok===P.sets?" on":"")+'"></span></span></button>'+
      '<div class="ex-b">'+bell+
      '<div class="alvo"><div class="alvo-t"><b>'+alvoKg(e, P)+'</b><span>'+P.sets+' x '+repsTxt(e, P)+' · RPE '+P.rpe+'</span>'+deltaTxt(e, P)+'</div>'+
      '<p>'+esc(P.motivo)+'</p></div>'+
      '<div class="sets">'+sets+'</div>'+chips+miniHist(e, P)+
      '<div class="cue"><b>EXECUÇÃO</b>'+esc(e.cue)+drop+
      (P.semFalha?'<br><br>Esta semana pare 2 repetições antes da falha.':'')+'</div>'+
      '<a class="vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+
      encodeURIComponent("Jeff Nippard "+e.n)+'">VER EXECUÇÃO ↗</a></div></div>';
  }).join("");

  var pct = total ? Math.round(feitas/total*100) : 0;
  view.innerHTML = html + corpo + '<p class="warn rod">'+rodape(feitas, total)+'</p>';
  pintaProg(pct);

  Array.prototype.forEach.call(view.querySelectorAll(".ex-h"), function(b){
    b.onclick = function(){
      var c = b.parentNode;
      c.classList.toggle("open");
      abertos[c.dataset.id] = c.classList.contains("open");
    };
  });
  ligaRun(week, day);
  Array.prototype.forEach.call(view.querySelectorAll(".chk"), function(b){
    b.onclick = function(){
      var card = b.closest(".ex"), row = b.closest(".set");
      var antes = !!card && card.classList.contains("done");
      var marcando = !b.classList.contains("on");
      var c = celula(b.dataset.e, +b.dataset.s);
      c.ok = marcando;
      if(marcando){
        /* grava o que está na tela: a série fica explícita no histórico */
        var ik = row.querySelector('input[data-f="kg"]'), ir = row.querySelector('input[data-f="rep"]');
        c.kg = ik.value === "" ? null : +ik.value;
        c.rep = ir.value === "" ? null : +ir.value;
      }
      salvaLog();
      b.classList.toggle("on");
      atualizaBarra();
      /* dois toques quando a ultima serie fecha o exercicio, um toque no resto */
      if(marcando && !antes && card && card.classList.contains("done")) toque([26,70,26]);
      else toque(18);
      var e = porId[b.dataset.e];
      if(marcando && e && e.desc) inicia(e.desc);
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll(".set input"), function(inp){
    inp.onchange = function(){
      var v = inp.value === "" ? null : +inp.value;
      celula(inp.dataset.e, +inp.dataset.s)[inp.dataset.f] = v;
      salvaLog();
      /* carga trocada numa série vale para as próximas ainda não marcadas */
      if(inp.dataset.f !== "kg") return;
      var reg = (log[chaveLog()] || {})[inp.dataset.e] || [];
      Array.prototype.forEach.call(view.querySelectorAll('.set input[data-f="kg"][data-e="'+inp.dataset.e+'"]'), function(o){
        var s = +o.dataset.s, r = reg[s];
        if(s > +inp.dataset.s && !(r && (r.ok || r.kg != null))) o.value = inp.value;
      });
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll(".rp"), function(c){
    c.onclick = function(){
      var k = chaveLog(), id = c.dataset.e, v = +c.dataset.v;
      if(!log[k]) log[k] = {};
      var mapa = log[k]._rpe || (log[k]._rpe = {});
      if(mapa[id] === v) delete mapa[id]; else mapa[id] = v;
      salvaLog();
      Array.prototype.forEach.call(view.querySelectorAll('.rp[data-e="'+id+'"]'), function(x){
        x.classList.toggle("on", +x.dataset.v === mapa[id]);
      });
      toque(12);
    };
  });
}

function atualizaBarra(){
  var dados = log[chaveLog()] || {}, feitas = 0, total = 0;
  Object.keys(contagem).forEach(function(id){
    var n = contagem[id], reg = dados[id] || [], ok = 0;
    for(var j=0;j<n;j++) if(reg[j] && reg[j].ok) ok++;
    feitas += ok; total += n;
    var card = view.querySelector('.ex[data-id="'+id+'"]');
    if(card){
      card.classList.toggle("done", ok===n);
      var tk = card.querySelector(".tick");
      if(tk) tk.classList.toggle("on", ok===n);
    }
  });
  pintaProg(total ? Math.round(feitas/total*100) : 0);
  var w = view.querySelector(".warn.rod");
  if(w) w.textContent = rodape(feitas, total);
}

function celula(ei, si){
  var k = chaveLog();
  if(!log[k]) log[k] = {};
  if(!log[k][ei]) log[k][ei] = [];
  if(!log[k][ei][si]) log[k][ei][si] = {};
  return log[k][ei][si];
}
function salvaLog(){ S.store("luiz:gym:v1", log); sujo(); mudou(); }

/* ---------------------------------------------------------------- progresso */
/* colunas de uma série; alvo opcional vira a linha tracejada do previsto.
   Toque ou foco numa coluna mostra o valor na linha de leitura (.rd). */
function colunas(vals, alvo, cor, rotulos, dicas){
  var todos = vals.concat(alvo || []).map(function(v){ return v || 0; });
  var max = Math.max.apply(null, todos.concat([1]));
  var h = '<div class="cols">';
  for(var i=0;i<vals.length;i++){
    var v = vals[i] || 0;
    h += '<div class="col" tabindex="0" data-tip="'+esc(dicas[i])+'">';
    if(alvo && alvo[i]) h += '<u style="bottom:'+(alvo[i]/max*100)+'%"></u>';
    h += '<i style="height:'+(v/max*100)+'%;background:'+(v ? cor : "var(--line)")+';opacity:'+(v ? 1 : .35)+'"></i></div>';
  }
  h += '</div><div class="axis">';
  for(var j=0;j<vals.length;j++) h += '<span>'+(rotulos ? rotulos[j] : j+1)+'</span>';
  return h + '</div>';
}

function ultimaDica(vals, dicas, vazio){
  for(var i=vals.length-1;i>=0;i--) if(vals[i] > 0) return esc(dicas[i]);
  return vazio || "Toque numa coluna para ver o valor.";
}

function escala(a, b){
  if(a === b){ a = a - Math.max(1, Math.abs(a)*.1); b = b + Math.max(1, Math.abs(b)*.1); }
  var bruto = (b - a)/3, mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  var q = bruto/mag, passo = (q < 1.5 ? 1 : q < 3 ? 2 : q < 7 ? 5 : 10) * mag;
  return {min:Math.floor(a/passo)*passo, max:Math.ceil(b/passo)*passo, passo:passo};
}

/* evolução da carga de um exercício no tempo real: espaços largos são pausas */
function grafico(e, H){
  var W = 320, Ht = 136, L = 34, Rr = 14, T = 14, B = 22;
  var pc = H.every(function(s){ return !(s.kg > 0); });
  var vals = H.map(function(s){ return pc ? s.maxRep : s.kg; });
  var t0 = H[0].t, t1 = H[H.length-1].t;
  if(t1 - t0 < 864e5*14){ t0 -= 864e5*7; t1 += 864e5*7; }
  var sc = escala(Math.min.apply(null, vals), Math.max.apply(null, vals));
  var X = function(t){ return L + (t - t0)/(t1 - t0)*(W - L - Rr); };
  var Y = function(v){ return T + (1 - (v - sc.min)/(sc.max - sc.min))*(Ht - T - B); };
  var g = "";
  for(var v = sc.min; v <= sc.max + 1e-9; v += sc.passo){
    var y = Y(v);
    g += '<line class="gr" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y+'" y2="'+y+'"/>'+
         '<text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+fmt(v)+'</text>';
  }
  var tr = B2.inicio.getTime();
  if(tr > t0 && tr < t1){
    var xr = X(tr), esq = xr > W*.7;   /* perto da borda direita, o rótulo vai para a esquerda */
    g += '<line class="ret" x1="'+xr+'" x2="'+xr+'" y1="'+T+'" y2="'+(Ht-B)+'"/>'+
         '<text x="'+(esq ? xr-4 : xr+4)+'" y="'+(T+7)+'"'+(esq ? ' text-anchor="end"' : '')+'>retomada</text>';
  }
  for(var i=1;i<H.length;i++){
    var pausa = dias(H[i-1].data, H[i].data) > 10;
    g += '<line class="sp-l" x1="'+X(H[i-1].t)+'" y1="'+Y(vals[i-1])+'" x2="'+X(H[i].t)+'" y2="'+Y(vals[i])+'"'+
         (pausa ? ' stroke-dasharray="2 5"' : '')+'/>';
  }
  H.forEach(function(s, i){
    g += '<circle class="sp-p '+(s.b === "b2" ? "sp-b" : "sp-a")+'" cx="'+X(s.t)+'" cy="'+Y(vals[i])+'" r="4"/>';
  });
  H.forEach(function(s, i){
    var tip = ddmm(s.data)+" · "+fmtSessao(e, s)+(s.rpe != null ? " · RPE "+fmt(s.rpe) : "");
    g += '<circle class="hit" tabindex="0" cx="'+X(s.t)+'" cy="'+Y(vals[i])+'" r="12" data-tip="'+esc(tip)+'"/>';
  });
  var u = H.length-1, ux = X(H[u].t), uy = Math.max(T+2, Y(vals[u])-9);
  g += '<text x="'+(ux-7)+'" y="'+uy+'" text-anchor="end" style="fill:var(--text);font-size:10px">'+
       (pc ? vals[u]+" reps" : fmt(vals[u])+" kg")+'</text>';
  g += '<text x="'+X(H[0].t)+'" y="'+(Ht-5)+'"'+(H.length === 1 ? ' text-anchor="middle"' : '')+'>'+ddmm(H[0].data)+'</text>';
  if(H.length > 1) g += '<text x="'+ux+'" y="'+(Ht-5)+'" text-anchor="end">'+ddmm(H[u].data)+'</text>';
  return '<svg class="gx" viewBox="0 0 '+W+' '+Ht+'" role="img" aria-label="Evolução de '+esc(e.n)+'">'+g+'</svg>';
}

function detalhe(e, H){
  var pc = H.every(function(s){ return !(s.kg > 0); });
  var best = null;
  H.forEach(function(s){
    var v = pc ? s.maxRep : s.e1;
    if(v > 0 && (!best || v > (pc ? best.maxRep : best.e1))) best = s;
  });
  var out = '<div class="chart-box">'+grafico(e, H)+'<p class="rd">Toque num ponto para ver a sessão.</p></div>'+
    '<div class="lg"><span><i class="dot" style="background:#5f6773"></i>antes de 16/11</span>'+
    '<span><i class="dot" style="background:var(--p10)"></i>retomada</span>'+
    '<span><i class="dash"></i>pausa</span></div>';
  if(best && (pc || best.top)) out += '<p class="warn" style="margin-top:10px">'+(pc
    ? "Recorde: "+best.maxRep+" repetições em "+ddmm(best.data)+"."
    : "Melhor série: "+fmt(best.top.kg)+" kg × "+best.top.rep+" em "+ddmm(best.data)+", 1RM estimado de "+Math.round(best.e1)+" kg.")+'</p>';
  out += '<table class="tb th2"><tr><th>Data</th><th>Séries</th><th>RPE</th><th>Volume</th></tr>';
  for(var i=H.length-1;i>=0;i--){
    var s = H[i];
    out += '<tr><td>'+ddmm(s.data)+'</td><td>'+esc(fmtSessao(e, s))+'</td><td>'+(s.rpe != null ? fmt(s.rpe) : "")+
           '</td><td>'+(s.vol ? fmtInt(s.vol) : "")+'</td></tr>';
    if(i > 0){
      var g = dias(H[i-1].data, s.data);
      if(g > 10) out += '<tr><td colspan="4" class="hp">pausa de '+durTxt(g)+'</td></tr>';
    }
  }
  return out + '</table>';
}

function medidor(nome, det, pct){
  var p = Math.round(pct*100);
  return '<div class="mr"><div class="l"><b>'+esc(nome)+'</b><span>'+det+(det ? " · " : "")+p+'%</span></div>'+
         '<div class="mt"><i style="width:'+Math.min(100, p)+'%"></i></div></div>';
}

function renderProg(){
  var H = hist(), tHoje = meia(new Date()), semA = semanaAtual();

  /* ---- aderência do bloco, só até hoje */
  var prevS = 0, feitas = 0, kmP = 0, kmR = 0, maiorL = 0;
  var semP = [], semR = [], longP = [], longR = [];
  for(var w=1; w<=B2.semanas; w++){
    var kp = 0, kr = 0;
    GYM.forEach(function(d){
      if(meia(dataDe(B2, w, d)) > tHoje) return;
      var dados = log["gym:b2:w"+w+":"+d] || {};
      DIAS[d].ex.forEach(function(e){
        var n = seriesB2(e, w), reg = dados[sid(e)] || [];
        prevS += n;
        for(var k=0;k<n;k++) if(reg[k] && reg[k].ok) feitas++;
      });
    });
    DOW.forEach(function(d){
      var c = CORRIDA[w][d], r = run["b2:w"+w+":"+d];
      if(c){ kp += c.km; if(meia(dataDe(B2, w, d)) <= tHoje) kmP += c.km; }
      if(r && r.km > 0) kr += +r.km;
    });
    kmR += kr;
    semP.push(limpa(kp)); semR.push(limpa(kr));
    var rd = run["b2:w"+w+":dom"];
    longP.push(CORRIDA[w].dom.km); longR.push(rd && rd.km > 0 ? +rd.km : 0);
    if(rd && rd.km > maiorL) maiorL = +rd.km;
  }

  var h = '<h1 class="hd">PROGRESSO</h1><p class="sub">SEMANA '+semA+' DE '+B2.semanas+' · RETOMADA ATÉ '+
          ddmm(dataDe(B2, B2.semanas, "dom"))+'</p>';
  h += '<div class="kpi">'+
    '<div><b>'+(prevS ? Math.round(feitas/prevS*100) : 0)+'%</b><em>SÉRIES FEITAS<br>NA RETOMADA</em></div>'+
    '<div><b>'+fmtKm(kmR)+'</b><em>KM CORRIDOS<br>DE '+fmtKm(kmP)+' ATÉ HOJE</em></div>'+
    '<div><b>'+fmtKm(maiorL)+'</b><em>MAIOR LONGÃO<br>META 21,1 KM</em></div></div>';

  /* ---- quanto da carga de antes da pausa já voltou */
  var voltas = [];
  todosEx().forEach(function(e){
    if(e.pc) return;
    var Hs = H.g[sid(e)] || [], pos = null;
    Hs.forEach(function(s){ if(s.b === "b2") pos = s; });
    if(!antesDe(Hs, B2.inicio.getTime()) || !pos || !(pos.kg > 0)) return;
    var Bs = cargaBase(e);
    if(Bs.kg > 0) voltas.push({e:e, pct:pos.kg/Bs.kg, pos:pos, base:Bs});
  });
  h += '<div class="card"><h3>Carga de volta</h3><p class="cap">ÚLTIMA CARGA CONTRA A DE ANTES DA PAUSA</p>';
  if(voltas.length){
    voltas.forEach(function(v){
      if(v.e.main) h += medidor(v.e.n, fmt(v.pos.kg)+" de "+fmt(arredE(v.e, v.base.kg))+" kg", v.pct);
    });
    var media = voltas.reduce(function(a, v){ return a + v.pct; }, 0)/voltas.length;
    h += medidor("Média de "+voltas.length+" exercícios", "", media)+
      '<p class="warn">O plano é 80% na semana 1, 90% na semana 2 e a volta aos 100% entre as semanas 3 e 5, pela progressão dupla.</p>';
  } else {
    h += '<p class="empty">Registre os treinos da retomada e aqui aparece quanto da carga de antes da pausa já voltou.</p>';
  }
  h += '</div>';

  /* ---- linha do tempo desde o início do bloco antigo, até a semana atual */
  var fimT = Math.min(tHoje, meia(dataDe(B2, B2.semanas, "dom")));
  var NS = Math.max(1, Math.floor(dias(B1.inicio, new Date(fimT))/7) + 1);
  var ton = enche(NS, 0), km = enche(NS, 0), rit = enche(NS, 0), ritKm = enche(NS, 0);
  Object.keys(H.g).forEach(function(id){
    H.g[id].forEach(function(s){
      var i = Math.floor(dias(B1.inicio, s.data)/7);
      if(i >= 0 && i < NS) ton[i] += s.vol;
    });
  });
  var FACEIS = {"Fácil":1, "Regenerativo":1, "Longão":1, "Progressivos":1, "Meia maratona":1};
  H.r.forEach(function(r){
    var i = Math.floor(dias(B1.inicio, r.data)/7);
    if(i < 0 || i >= NS) return;
    km[i] += r.km;
    if(FACEIS[r.tipo] && r.seg > 0){ rit[i] += r.seg; ritKm[i] += r.km; }
  });
  var rot = [], dTon = [], dKm = [];
  for(var i=0;i<NS;i++){
    var ini = new Date(B1.inicio.getTime()); ini.setDate(ini.getDate() + 7*i);
    rot.push((i % 4 === 0 && i < 12) || i === 13 || i === 17 ? ddmm(ini) : "");
    dTon.push("Semana de "+ddmm(ini)+": "+(ton[i]/1000).toFixed(1).replace(".", ",")+" t");
    dKm.push("Semana de "+ddmm(ini)+": "+fmtKm(km[i])+" km");
  }
  var tonT = ton.map(function(v){ return v/1000; });
  h += '<div class="card"><h3>Linha do tempo</h3><p class="cap">DESDE 17/08 · COLUNA VAZIA É SEMANA PARADA</p>'+
    '<div class="chart-box"><p class="cap" style="margin:0 0 2px">MUSCULAÇÃO · TONELADAS POR SEMANA</p>'+
    colunas(tonT, null, "var(--p25)", rot, dTon)+'<p class="rd">'+ultimaDica(tonT, dTon)+'</p></div>'+
    '<div class="chart-box" style="margin-top:14px"><p class="cap" style="margin:0 0 2px">CORRIDA · KM POR SEMANA</p>'+
    colunas(km, null, "var(--p10)", rot, dKm)+'<p class="rd">'+ultimaDica(km, dKm)+'</p></div></div>';

  /* ---- longão */
  var rotL = [], dL = [], prox = null;
  for(var w2=1; w2<=B2.semanas; w2++){
    var dd = dataDe(B2, w2, "dom");
    rotL.push(ddmm(dd));
    dL.push(ddmm(dd)+": "+(longR[w2-1] ? fmtKm(longR[w2-1])+" de " : "previsto ")+fmtKm(longP[w2-1])+" km");
    if(!prox && meia(dd) >= tHoje && !longR[w2-1]) prox = w2;
  }
  h += '<div class="card"><h3>Longão rumo aos 21 km</h3><p class="cap">DOMINGOS DA RETOMADA</p>'+
    '<div class="chart-box">'+colunas(longR, longP, "var(--p15)", rotL, dL)+

/* ---------------------------------------------------------------- háptico
   São dois caminhos independentes, e no iPhone o que vale é o primeiro.

   1. O overlay .hapt é um <input type="checkbox" switch> invisível por cima
      do botão (Safari 17.4+). Quem dispara o toque é o dedo acertando o
      controle, não o código: o iOS 26.5 bloqueou háptico programado, então
      .click() por script não serve mais. Duas consequências que valem
      lembrar antes de mexer aqui: no iPhone todo toque sai igual, sem como
      variar intensidade, e o fim do descanso não vibra, porque ali não há
      dedo nenhum na tela.

   2. Onde navigator.vibrate existe de verdade (Android), dá para variar a
      duração, e é o que toque() faz. No iPhone ela não faz nada, e tudo
      bem, porque o overlay já resolveu. Falha em silêncio, igual ao bip. */
function toque(padrao){
  try{ if(navigator.vibrate) navigator.vibrate(padrao); }catch(e){}
}

/* Linha de diagnóstico do Ajustes, para saber em que aparelho estamos. */
function ambiente(){
  var m = /OS ([0-9]+)[._]([0-9]+)/.exec(navigator.userAgent);
  return "iOS " + (m ? m[1]+"."+m[2] : "?") +
         " · vibrate " + (navigator.vibrate ? "existe" : "ausente") +
         " · wakeLock " + (navigator.wakeLock ? "ok" : "indisponível, use https");
}

/* ---------------------------------------------------------------- timer */
var fim = 0, tick = null, ac = null, avisado = true;
var elTimer = document.querySelector(".timer");

/* ---------------------------------------------------------------- tela acesa
   Quando a tela apaga, o iOS suspende os timers da página em poucos
   segundos, o setInterval do cronômetro para e o apito nunca chega. O Wake
   Lock segura a tela acesa só enquanto o descanso corre, e solta no fim.

   Exige HTTPS: em http:// simples navigator.wakeLock nem existe, então em
   teste na rede local isto silenciosamente não faz nada. Também é liberado
   pelo próprio iOS quando a aba deixa de ficar visível, por isso é pedido
   de novo no visibilitychange enquanto ainda houver descanso correndo. */
var trava = null;

function seguraTela(){
  if(!navigator.wakeLock || trava) return;
  try{
    navigator.wakeLock.request("screen").then(function(t){
      trava = t;
      t.addEventListener("release", function(){ trava = null; });
    }, function(){});
  }catch(e){}
}

function soltaTela(){
  if(!trava) return;
  try{ trava.release(); }catch(e){}
  trava = null;
}

/* Pisca o cronômetro. É o único aviso que sobra quando o telefone está no
   silencioso E longe do ouvido, já que háptico sem dedo na tela é bloqueado. */
function pisca(){
  if(!elTimer) return;
  elTimer.classList.remove("flash");
  void elTimer.offsetWidth;   /* reinicia a animação */
  elTimer.classList.add("flash");
}

function bip(){
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
    [0, 220, 440].forEach(function(atraso){
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = 880;
      var t = ac.currentTime + atraso/1000;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
  toque([220,120,220]);
  pisca();
  soltaTela();
}

function restantes(){ return fim ? Math.max(0, Math.ceil((fim - Date.now())/1000)) : 0; }

function mostra(){
  var s = restantes();
  var el = document.getElementById("tnow");
  el.textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  el.classList.toggle("ring", s === 0 && fim > 0);
  if(s === 0 && !avisado){ avisado = true; bip(); }
}

function inicia(seg){
  try{ if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
       if(ac.state === "suspended") ac.resume(); }catch(e){}
  seguraTela();
  if(elTimer) elTimer.classList.remove("flash");
  fim = Date.now() + seg*1000;
  avisado = false;
  if(!tick) tick = setInterval(mostra, 250);
  mostra();
}

document.addEventListener("visibilitychange", function(){
  if(document.hidden) return;
  mostra();
  if(restantes() > 0) seguraTela();   /* o iOS solta a trava ao esconder a aba */
});
window.addEventListener("focus", mostra);

/* toque() cobre o Android. No iPhone quem vibra e o overlay .hapt dentro de
   cada botao, acionado pelo proprio dedo. */
document.getElementById("t60").onclick = function(){ toque(18); inicia(60); };
document.getElementById("t120").onclick = function(){ toque(18); inicia(120); };
document.getElementById("t180").onclick = function(){ toque(18); inicia(180); };
document.getElementById("tstop").onclick = function(){
  toque(18);
  fim = 0; avisado = true;
  if(elTimer) elTimer.classList.remove("flash");
  soltaTela();
  mostra();
};

/* ---------------------------------------------------------------- cópia de segurança
   Os registros moram só no localStorage deste aparelho, e o app da Tela de
   Início guarda os dados separados do Safari. A cópia é a proteção contra
   reinstalar o atalho, trocar de aparelho e a limpeza do Safari, que apaga
   dados de sites que ficam 7 dias sem ser abertos. O app da Tela de Início
   não sofre essa limpeza. */
var VERSAO = "2.1";
var meta = {};          /* datas ISO: copia (última cópia), mudou (último registro), adiar (aviso adiado até) */
var persistido = false;

function salvaMeta(){ S.store("luiz:meta:v1", meta); }
function mudou(){ meta.mudou = new Date().toISOString(); salvaMeta(); }
function isoLocal(x){ return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); }
function quando(iso){
  var x = new Date(iso), d = dias(x, new Date());
  return d <= 0 ? "hoje" : d === 1 ? "ontem" : ddmm(x)+", há "+d+" dias";
}
function noApp(){
  return window.navigator.standalone === true ||
         !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}
function plural(n, um, varios){ return n+" "+(n === 1 ? um : varios); }

/* dias de musculação com série marcada e corridas registradas, e o período */
function resumoDados(){
  var H = hist(), datas = {};
  Object.keys(H.g).forEach(function(id){ H.g[id].forEach(function(s){ datas[s.t] = 1; }); });
  var ts = Object.keys(datas).map(Number).concat(H.r.map(function(r){ return r.t; }));
  return {treinos:Object.keys(datas).length, corridas:H.r.length,
          ini:ts.length ? new Date(Math.min.apply(null, ts)) : null,
          fim:ts.length ? new Date(Math.max.apply(null, ts)) : null};
}
function resumoTxt(R){
  if(!R.treinos && !R.corridas) return "Nenhum treino registrado neste aparelho.";
  return "Neste aparelho: <b>"+plural(R.treinos, "treino", "treinos")+" e "+plural(R.corridas, "corrida", "corridas")+
         "</b>, de "+ddmm(R.ini)+" a "+ddmm(R.fim)+".";
}

/* O aviso aparece quando há registro sem cópia: nunca houve cópia, ou a
   última tem mais de 7 dias e veio registro novo depois dela. */
function copiaPendente(){
  var R = resumoDados();
  if(!R.treinos && !R.corridas) return false;
  if(meta.adiar && Date.now() < Date.parse(meta.adiar)) return false;
  if(!meta.copia) return true;
  var c = Date.parse(meta.copia), m = meta.mudou ? Date.parse(meta.mudou) : 0;
  return m > c && Date.now() - c > 7*864e5;
}

function exporta(depois){
  var texto = JSON.stringify({versao:2, gerado:new Date().toISOString(), cfg:cfg, log:log, run:run});
  var nome = "treino-"+isoLocal(new Date())+".json";
  var feito = function(){
    meta.copia = new Date().toISOString(); meta.adiar = null; salvaMeta();
    if(depois) depois(true);
  };
  /* No celular, a folha de compartilhar do sistema oferece Salvar em Arquivos
     e funciona também no app da Tela de Início. No computador, o arquivo baixa. */
  try{
    var celular = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
    var arq = new File([texto], nome, {type:"application/json"});
    if(celular && navigator.canShare && navigator.canShare({files:[arq]})){
      navigator.share({files:[arq], title:"Cópia do treino"}).then(feito, function(){ if(depois) depois(false); });
      return;
    }
  }catch(e){}
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texto], {type:"application/json"}));
  a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  feito();
}

function temOk(a){ return Array.isArray(a) && a.some(function(r){ return r && r.ok; }); }

/* Junta a cópia com o que já está aqui. Em conflito, o que já está no app
   vence, então restaurar nunca apaga um registro existente. */
function junta(d){
  if(d.log && typeof d.log === "object") Object.keys(d.log).forEach(function(k){
    var de = d.log[k];
    if(!de || typeof de !== "object") return;
    if(!log[k]){ log[k] = de; return; }
    var aqui = log[k];
    Object.keys(de).forEach(function(id){
      if(id === "_rpe") aqui._rpe = Object.assign({}, de._rpe || {}, aqui._rpe || {});
      else if(!temOk(aqui[id]) && temOk(de[id])) aqui[id] = de[id];
    });
  });
  if(d.run && typeof d.run === "object") Object.keys(d.run).forEach(function(k){
    var r = d.run[k];
    if(r && r.km > 0 && !(run[k] && run[k].km > 0)) run[k] = r;
  });
  /* os 1RMs da cópia só entram se este aparelho nunca gravou os dele */
  if(d.cfg && typeof d.cfg === "object" && !S.load("luiz:cfg:v1", null)){
    cfg = Object.assign(cfg, d.cfg);
    S.store("luiz:cfg:v1", cfg);
  }
  if(!meta.copia && d.gerado){ meta.copia = d.gerado; salvaMeta(); }
}

/* aviso no topo da tela enquanto houver registro sem cópia */
function avisoCopia(){
  if(!copiaPendente()) return;
  var txt = meta.copia
    ? "A última cópia é de "+ddmm(new Date(meta.copia))+" e há registros novos depois dela."
    : "Seus treinos ficam só neste aparelho e ainda não têm cópia. Salve uma em Arquivos.";
  view.insertAdjacentHTML("afterbegin",
    '<div class="cp" id="cpAviso"><p><b>Cópia de segurança.</b> '+txt+'</p>'+
    '<div class="bk-g"><span class="bk pri" id="cpFaz" role="button">FAZER CÓPIA'+SW+'</span>'+
    '<span class="bk" id="cpDepois" role="button">DEPOIS'+SW+'</span></div></div>');
  var tira = function(){ var b = document.getElementById("cpAviso"); if(b) b.remove(); };
  document.getElementById("cpFaz").onclick = function(){
    toque(18);
    exporta(function(ok){ if(ok) tira(); });
  };
  document.getElementById("cpDepois").onclick = function(){
    toque(12);
    meta.adiar = new Date(Date.now() + 3*864e5).toISOString(); salvaMeta();
    tira();
  };
}

/* pede ao navegador para não apagar os dados sozinho. No iPhone, quem
   decide é o próprio sistema, e o app da Tela de Início costuma ganhar. */
function pedePersistencia(){
  try{
    var st = navigator.storage;
    if(!st || !st.persist) return;
    (st.persisted ? st.persisted() : Promise.resolve(false))
      .then(function(p){ return p || st.persist(); })
      .then(function(p){ persistido = !!p; }, function(){});
  }catch(e){}
}

      var d = null;
      try{ d = JSON.parse(fr.result); }catch(err){}
      var valido = d && typeof d === "object" &&
                   ((d.log && typeof d.log === "object") || (d.run && typeof d.run === "object"));
      if(!valido){
        abreAjustes("Arquivo inválido. Escolha um arquivo treino-....json salvo por este app.", false);
        return;
      }
      junta(d);
      migraSlugs(); migraB2();
      S.store("luiz:gym:v1", log); S.store("luiz:run:v1", run);
      sujo();
      var R2 = resumoDados();
      render();
      abreAjustes("Cópia"+(d.gerado ? " de "+ddmm(new Date(d.gerado)) : "")+" restaurada. Agora o app tem "+
        plural(R2.treinos, "treino", "treinos")+" e "+plural(R2.corridas, "corrida", "corridas")+".", true);
    };
    fr.readAsText(f);
  };
  document.getElementById("zerar").onclick = function(){
    if(!window.confirm("Apagar todos os treinos e corridas deste aparelho? Não tem como desfazer. Faça uma cópia antes.")) return;
    log = {}; run = {};
    S.store("luiz:gym:v1", log); S.store("luiz:run:v1", run);
    sujo(); mudou();
    sheet.classList.remove("on"); render();
  };
  sheet.classList.add("on");
}
document.getElementById("cfg").onclick = function(){ abreAjustes(); };
sheet.onclick = function(e){ if(e.target === sheet) sheet.classList.remove("on"); };

document.getElementById("wm").onclick = function(){ if(week>1){ week--; render(); } };
document.getElementById("wp").onclick = function(){ if(week<B2.semanas){ week++; render(); } };

/* ---------------------------------------------------------------- migrações
   1. Versões antigas gravavam a série sob o índice numérico do exercício.
      A chave passou a ser o slug estável sid(e). Converte uma única vez,
      usando a ordem dos exercícios do dia, que não mudou. Idempotente. */
function migraSlugs(){
  var mudou = false;
  Object.keys(log).forEach(function(k){
    var m = RX_G1.exec(k);
    if(!m) return;
    var lista = DIAS[m[2]] ? DIAS[m[2]].ex : null;
    if(!lista) return;
    var dados = log[k];
    Object.keys(dados).forEach(function(id){
      if(!/^\d+$/.test(id)) return;
      var e = lista[+id];
      if(!e) return;
      var novo = sid(e);
      if(novo === id) return;
      if(!dados[novo]) dados[novo] = dados[id];
      delete dados[id];
      mudou = true;
    });
  });
  if(mudou) S.store("luiz:gym:v1", log);
}

/* 2. As semanas 14 a 16 do plano antigo caem nas mesmas datas das semanas 1
      a 3 da retomada. O que foi registrado nelas muda de chave, com kg e
      reps explícitos, para aparecer no dia certo do plano novo. Se o dia
      novo já tiver registro do mesmo exercício, o do dia novo vence, como
      na restauração de uma cópia antiga. */
function migraB2(){
  var mg = false, mr = false;
  Object.keys(log).forEach(function(k){
    var m = RX_G1.exec(k); if(!m) return;
    var w = +m[1], d = m[2]; if(w < 14 || w > 16) return;
    var nk = "gym:b2:w"+(w-13)+":"+d;
    var dados = log[k];
    DIAS[d].ex.forEach(function(e){
      var reg = dados[sid(e)]; if(!reg) return;
      var pr = presB1(e, w);
      reg.forEach(function(r){
        if(!r) return;
        if(r.kg == null && pr.kg) r.kg = pr.kg;
        if(r.rep == null && repNum(pr.reps) != null) r.rep = repNum(pr.reps);
      });
    });
    if(!log[nk]) log[nk] = dados;
    else Object.keys(dados).forEach(function(id){
      if(id === "_rpe") log[nk]._rpe = Object.assign({}, dados._rpe || {}, log[nk]._rpe || {});
      else if(!temOk(log[nk][id]) && temOk(dados[id])) log[nk][id] = dados[id];
    });
    delete log[k]; mg = true;
  });
  Object.keys(run).forEach(function(k){
    var m = RX_R1.exec(k); if(!m) return;
    var w = +m[1], d = m[2]; if(w < 14 || w > 16) return;
    var nk = "b2:w"+(w-13)+":"+d;
    if(!(run[nk] && run[nk].km > 0)) run[nk] = run[k];
    delete run[k]; mr = true;
  });
  if(mg) S.store("luiz:gym:v1", log);
  if(mr) S.store("luiz:run:v1", run);
}

/* ---------------------------------------------------------------- início */
(function(){
  cfg = Object.assign(cfg, S.load("luiz:cfg:v1", {}));
  log = S.load("luiz:gym:v1", {});
  run = S.load("luiz:run:v1", {});
  meta = S.load("luiz:meta:v1", {}) || {};
  migraSlugs();
  migraB2();
  pedePersistencia();
  var d = dias(B2.inicio, new Date());
  if(d < 0){ week = 1; day = "seg"; }
  else if(d >= 7*B2.semanas){ week = B2.semanas; day = "prog"; }
  else { week = Math.floor(d/7)+1; day = DOW[d%7]; }
  mostra();
  render();
})();
})();
